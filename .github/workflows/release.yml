name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build macOS App and DMG
        run: |
          pyinstaller --noconfirm --onedir --windowed \
            --name "AgentFeed" \
            --icon "icon.icns" \
            --collect-all "uvicorn" \
            --collect-all "webview" \
            --collect-all "fastapi" \
            --hidden-import "server" \
            --hidden-import "paths" \
            --hidden-import "run_daily_brief" \
            --hidden-import "llm_curator" \
            --hidden-import "distributor_manager" \
            --hidden-import "scraper_macro" \
            --hidden-import "yfinance" \
            --hidden-import "plyer" \
            --add-data "web_admin.html:." \
            --add-data "icon.png:." \
            --add-data "sources.example.json:." \
            --add-data ".env.example:." \
            desktop.py
          chmod +x build_dmg.sh
          ./build_dmg.sh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "AgentFeed ${{ github.ref_name }} (Universal Edition)"
          body: |
            ## 📡 AgentFeed ${{ github.ref_name }} - Universal AI Information Perception & Desktop Hub
            
            ### 🌟 What's New
            - **Universal for All Professions**: No financial bias, tailored for developers, designers, product managers, researchers, and creators.
            - **Custom Focus & Persona**: Customize your AI curation focus with 1-click topic chips.
            - **Scenario Presets**: 1-click switch between Tech & Dev, Product & Design, Business & Startups, Academic Research, and Global Trends.
            - **Dedicated Export Modal**: 1-click clipboard copy + direct save to `~/Downloads/`.
            - **Human-friendly Scheduler**: 1-click slot pills (Morning, Noon, Afternoon, Evening, Night) + quick routine combos.
            
            ### 📦 Downloads
            - **macOS (Apple Silicon & Intel)**: `AgentFeed-macOS.dmg`
          files: |
            dist/AgentFeed-macOS.dmg
